<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paraways | Coordenadas no encontradas</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/assets/paraways-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(160deg, #0B1738 45%, #070E22);
        color: #F2EDE0;
        font: 300 16px/1.62 "Inter", Arial, sans-serif;
        text-align: center; padding: 24px;
        position: relative; overflow: hidden;
      }
      .field { position: absolute; inset: 0; pointer-events: none; opacity: 0.5; }
      .card { position: relative; z-index: 1; max-width: 560px; }
      .mark { width: 64px; height: 64px; margin: 0 auto 34px; opacity: 0.9; animation: drift 16s ease-in-out infinite; filter: invert(92%) sepia(8%) saturate(340%) hue-rotate(357deg); }
      .code { font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: 0.24em; color: #B8935A; margin: 0 0 20px; }
      h1 { font: 400 clamp(34px, 6vw, 52px)/1.1 "Newsreader", Georgia, serif; letter-spacing: -0.02em; margin: 0 0 18px; color: #F2EDE0; }
      h1 em { font-style: italic; color: #B8935A; }
      p { color: rgba(242, 237, 224, 0.7); max-width: 440px; margin: 0 auto 34px; }
      .small { font-size: 13px; color: rgba(242, 237, 224, 0.5); margin-top: 14px; }
      .cta {
        display: inline-flex; align-items: center; gap: 14px;
        padding: 14px 26px; border: 1px solid #6B1018; border-radius: 2px;
        background: #6B1018; color: #F2EDE0;
        font: 500 14px "Inter", Arial, sans-serif; text-decoration: none;
        transition: background 0.3s, transform 0.3s;
      }
      .cta:hover { background: #7A1420; transform: translateY(-2px); }
      .coords { margin-top: 46px; font: 400 10.5px/1 "JetBrains Mono", monospace; letter-spacing: 0.16em; color: rgba(242, 237, 224, 0.35); }
      @keyframes drift { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
    </style>
  </head>
  <body>
    <div class="field" aria-hidden="true" id="stars"></div>
    <div class="card">
      <img class="mark" src="/assets/paraways-mark.svg" alt="" />
      <p class="code">ERROR 404 · FUERA DE CARTA</p>
      <h1>Coordenadas<br /><em>no encontradas.</em></h1>
      <p>La página que buscas no está en este mapa. El resto del territorio sigue exactamente donde lo dejamos.</p>
      <a class="cta" href="/">Volver al inicio <span>↗</span></a>
      <p class="small"><a href="/pt/" style="color:rgba(242,237,224,.55)">Português</a> · <a href="/en/" style="color:rgba(242,237,224,.55)">English</a> · <a href="/observatorio/" style="color:rgba(242,237,224,.55)">Observatorio</a></p>
      <p class="coords">25°16′S · 57°38′O — AQUÍ SÍ HAY MAPA</p>
    </div>
    <script>
      (function () {
        const host = document.getElementById('stars');
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
        let seed = 404404;
        const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
        for (let i = 0; i < 90; i++) {
          const c = document.createElementNS(svgNS, 'circle');
          c.setAttribute('cx', (rnd() * 100).toFixed(2) + '%');
          c.setAttribute('cy', (rnd() * 100).toFixed(2) + '%');
          c.setAttribute('r', rnd() > 0.92 ? 1.5 : 0.8);
          c.setAttribute('fill', '#F2EDE0');
          c.setAttribute('opacity', (0.06 + rnd() * 0.24).toFixed(2));
          svg.appendChild(c);
        }
        host.appendChild(svg);
      })();
    </script>
  </body>
</html>
