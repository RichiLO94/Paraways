<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1200" />
  <meta name="robots" content="noindex" />
  <title>Tarjeta Open Graph · Le Petit Trianon</title>
  <!-- Plantilla de la tarjeta Open Graph (1200×630) del desarrollo. Se renderiza con tools/maqueta/og-render.js
       sobre el servidor local del repo: /tools/maqueta/og-trianon.html?lang=es|pt|en|fr → assets/og-trianon-<lang>.png.
       Fondo: la foto real de la casa (assets/trianon-foto-casa.jpg, 1920×1088, salida de sr-photos.py) a la derecha, con un velo
       medianoche desde la izquierda donde va el texto; tipografías del sitio. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #0B1738; --paper: #F2EDE0; --paper-2: #F8F4E8; --gold: #B8935A; --gold-on-wine: #CFAD74; }
    html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--ink); color: var(--paper); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    /* la casa, a la derecha: la foto (1920×1088) a 660 px de alto, con la fachada centrada hacia x ≈ 840 */
    .photo { position: absolute; top: -12px; left: 300px; height: 660px; width: auto; display: block; filter: saturate(0.96) brightness(0.97); }
    .veil { position: absolute; inset: 0; background: linear-gradient(90deg, var(--ink) 0px, var(--ink) 330px, rgba(11, 23, 56, 0.9) 420px, rgba(11, 23, 56, 0.62) 520px, rgba(11, 23, 56, 0.24) 640px, rgba(11, 23, 56, 0) 760px); }
    .veil-low { position: absolute; inset: 0; background: linear-gradient(to top, rgba(11, 23, 56, 0.92) 0px, rgba(11, 23, 56, 0.55) 70px, rgba(11, 23, 56, 0) 170px); }
    .veil-top { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(11, 23, 56, 0.35) 0px, rgba(11, 23, 56, 0) 120px); }
    .brand { position: absolute; left: 72px; top: 56px; display: inline-flex; align-items: center; gap: 13px; font: 500 32px/1 Newsreader, Georgia, serif; letter-spacing: -0.02em; color: var(--paper); }
    .brand svg { width: 34px; height: 34px; display: block; overflow: visible; }
    .copy { position: absolute; left: 72px; width: 520px; bottom: 124px; }
    .eyebrow { font: 500 14px/1.5 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-on-wine); margin: 0 0 20px; }
    h1 { margin: 0 0 22px; font: 500 100px/0.94 Newsreader, Georgia, serif; font-variation-settings: 'opsz' 72; letter-spacing: -0.025em; color: var(--paper); }
    h1 em { display: block; font-style: italic; font-weight: 400; color: var(--gold-on-wine); }
    .sub { margin: 0; font: 400 27px/1.3 Inter, system-ui, sans-serif; color: rgba(242, 237, 224, 0.88); letter-spacing: -0.005em; text-wrap: balance; }
    .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; align-items: baseline; padding-top: 18px; border-top: 1px solid rgba(207, 173, 116, 0.34); font: 400 15px/1 Inter, system-ui, sans-serif; color: rgba(242, 237, 224, 0.7); }
  </style>
</head>
<body>
  <div class="card">
    <img class="photo" src="/assets/trianon-foto-casa.jpg" alt="" />
    <div class="veil-top"></div>
    <div class="veil"></div>
    <div class="veil-low"></div>
    <div class="brand" id="brand"><svg viewBox="0 0 120 120" aria-hidden="true"><g stroke="#B8935A" stroke-width="3.2" stroke-linecap="round" fill="none"><line x1="60" y1="24" x2="60" y2="49"/><line x1="60" y1="71" x2="60" y2="96"/><line x1="24" y1="60" x2="49" y2="60"/><line x1="71" y1="60" x2="96" y2="60"/><line x1="34.5" y1="34.5" x2="52.2" y2="52.2"/><line x1="67.8" y1="67.8" x2="85.5" y2="85.5"/><line x1="85.5" y1="34.5" x2="67.8" y2="52.2"/><line x1="52.2" y1="67.8" x2="34.5" y2="85.5"/></g><circle cx="60" cy="60" r="5" fill="none" stroke="#B8935A" stroke-width="2"/></svg>paraways</div>
    <div class="copy">
      <p class="eyebrow" id="eyebrow">San Bernardino · Paraguay · Investor Pass</p>
      <h1 id="title">Le Petit <em>Trianon</em></h1>
      <p class="sub" id="sub">Tu lote y la construcción de tu&nbsp;casa, dentro del Investor&nbsp;Pass</p>
    </div>
    <div class="foot">
      <span id="site">paraways.com/le-petit-trianon</span>
    </div>
  </div>
  <script>
    (function () {
      var T = {
        es: { eyebrow: 'San Bernardino · Paraguay · Investor Pass', sub: 'Tu lote y la construcción de tu\u00a0casa, dentro del Investor\u00a0Pass', site: 'paraways.com/le-petit-trianon' },
        pt: { eyebrow: 'San Bernardino · Paraguai · Investor Pass', sub: 'Seu lote com casa em San\u00a0Bernardino, dentro do Investor\u00a0Pass', site: 'paraways.com/pt/le-petit-trianon' },
        en: { eyebrow: 'San Bernardino · Paraguay · Investor Pass', sub: 'Your plot and house in San\u00a0Bernardino, under the Investor\u00a0Pass', site: 'paraways.com/en/le-petit-trianon' },
        fr: { eyebrow: 'San Bernardino · Paraguay · Investor Pass', sub: 'Votre parcelle avec maison à San\u00a0Bernardino, dans le cadre de l’Investor\u00a0Pass', site: 'paraways.com/fr/le-petit-trianon' }
      };
      var lang = (new URLSearchParams(location.search).get('lang') || 'es').toLowerCase();
      var t = T[lang] || T.es; document.documentElement.lang = lang;
      document.getElementById('eyebrow').textContent = t.eyebrow;
      document.getElementById('sub').textContent = t.sub;
      document.getElementById('site').textContent = t.site;
    })();
  </script>
</body>
</html>
